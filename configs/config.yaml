project:
  name: FloodRiskAI
  version: "1.0"

spatial:
  grid_resolution: 0.01
  coordinate_system: "EPSG:4326"

temporal:
  frequency: "daily"
  rainfall_windows:
    - 1
    - 3
    - 7
    - 14

targets:
  flood:
    type: binary
    positive_class: 1

  severity:
    type: multiclass
    classes:
      0: Low
      1: Moderate
      2: High
      3: Severe

models:
  baseline:
    - logistic_regression
    - random_forest

  advanced:
    - xgboost
    - lightgbm

evaluation:
  classification_metrics:
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc

  regression_metrics:
    - mae
    - rmse
    - r2