project:
  name: FloodRiskAI
  version: "1.0"

study_area:
  country: India
  state: Bihar
  basin: Ganga

temporal:
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  frequency: daily

spatial:
  coordinate_system: "EPSG:4326"
  grid_resolution: 0.05

rainfall:
  windows:
    - 1
    - 3
    - 7
    - 14

targets:
  flood:
    type: binary
    classes:
      0: "No Flood"
      1: "Flood"
  severity:
    type: multiclass
    classes:
      0: "Low"
      1: "Moderate"
      2: "High"
      3: "Severe"

models:
  baseline:
    - logistic_regression
    - random_forest
  advanced:
    - xgboost
    - lightgbm

evaluation:
  classification:
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
  regression:
    - mae
    - rmse
    - r2